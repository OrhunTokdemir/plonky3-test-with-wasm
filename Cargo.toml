[package]
name = "voter_stark"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["aggregation"]
# Recursive aggregation (native only: far too heavy to compile and run as wasm).
aggregation = [
    "dep:p3-batch-stark",
    "dep:p3-lookup",
    "dep:p3-recursion",
    "dep:p3-circuit",
    "dep:p3-circuit-prover",
    "dep:p3-poseidon2-circuit-air",
    "dep:serde_json",
]

[dependencies]
getrandom = "0.3"
ml-dsa = "0.1.1"
p3-air = "=0.9.0-rc.2"
p3-baby-bear = "=0.9.0-rc.2"
p3-challenger = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-dft = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-fri = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-merkle-tree = "=0.9.0-rc.2"
p3-poseidon2 = "=0.9.0-rc.2"
p3-poseidon2-air = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
p3-batch-stark = { version = "=0.9.0-rc.2", optional = true }
p3-lookup = { version = "=0.9.0-rc.2", optional = true }
p3-recursion = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7", optional = true }
p3-circuit = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7", optional = true }
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7", optional = true }
p3-poseidon2-circuit-air = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7", optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "aggregator"
required-features = ["aggregation"]

[[test]]
name = "aggregation"
required-features = ["aggregation"]

# Recursion is unusably slow without optimizations.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
